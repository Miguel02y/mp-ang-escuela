<section class="about-summary" aria-label="Quiénes somos">
  <div class="about-summary__inner">
    <div class="about-summary__media">
      <img
        ngSrc="images/equipo-docente.jpg"
        width="640"
        height="480"
        alt="Equipo docente y directivo del Centro Educativo Rural Peñalisa"
        class="about-summary__image about-summary__image--main"
      />
      <img
        ngSrc="images/danza-folclorica.png"
        width="640"
        height="480"
        alt="Estudiantes presentando una danza folclórica en la institución"
        class="about-summary__image about-summary__image--secondary"
      />
    </div>
    <div class="about-summary__content">
      <app-encabezado-seccion
        textoSuperior="Quiénes somos"
        titulo="Educación rural con raíces en nuestra comunidad"
        descripcion="Somos una institución pública que forma en valores, identidad campesina y pensamiento crítico a las familias de la vereda Peñalisa y sus alrededores, en el municipio de Salgar, Antioquia."
      />
      <a class="about-summary__link" [routerLink]="rutas.pei">Conoce nuestro PEI →</a>
    </div>
  </div>
</section>
