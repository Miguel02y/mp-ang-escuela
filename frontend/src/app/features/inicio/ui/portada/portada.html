<section class="hero" aria-labelledby="hero-title">
  <div class="hero__media">
    <img
      ngSrc="images/hero-fachada.png"
      fill
      priority
      alt="Cancha deportiva y aulas del Centro Educativo Rural Peñalisa, rodeadas de montaña"
      class="hero__image"
    />
    <div class="hero__overlay" aria-hidden="true"></div>
  </div>
  <div class="hero__content">
    <p class="hero__eyebrow">Centro Educativo Rural Peñalisa · Salgar, Antioquia</p>
    <h1 id="hero-title" class="hero__title">Transformando futuro</h1>
    <p class="hero__subtitle">
      Formamos niñas, niños y jóvenes de la vereda Peñalisa con una educación rural de calidad,
      arraigada en nuestra comunidad y comprometida con su desarrollo.
    </p>
    <div class="hero__actions">
      <a class="hero__cta hero__cta--primary" routerLink="/admisiones">Proceso de admisiones</a>
      <a class="hero__cta hero__cta--secondary" routerLink="/institucion/mision-vision"
        >Conócenos</a
      >
    </div>
  </div>
</section>
