@if (abierto()) {
  <div class="mobile-nav-backdrop" (click)="cerrar()"></div>
  <div
    class="mobile-nav"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación"
    (keydown.escape)="cerrar()"
  >
    <div class="mobile-nav__header">
      <span class="mobile-nav__title">Menú</span>
      <button type="button" class="mobile-nav__close" (click)="cerrar()">
        <span aria-hidden="true">✕</span>
        <span class="sr-only">Cerrar menú</span>
      </button>
    </div>
    <nav aria-label="Navegación principal">
      <ul class="mobile-nav__list">
        @for (elemento of elementos(); track elemento.etiqueta) {
          <li>
            <app-item-menu-movil [elemento]="elemento" (enlaceActivado)="cerrar()" />
          </li>
        }
      </ul>
    </nav>
  </div>
}
